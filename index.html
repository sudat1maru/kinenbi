<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日は何の日？</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🎉 今日は何の日？</h1>
    <p class="description">
    記念日を日付から検索したり、ランダムに探したりできるサイトです。<br>
    記念日の情報は
    <a href="https://www.kinenbi.gr.jp/" target="_blank">
        一般社団法人 日本記念日協会
    </a>
    の情報を参照しています。
</p>

    <div class="search">
        <h2>📅 日付から探す</h2>

        <select id="month">
    <option value="">月</option>
</select>

<select id="day">
    <option value="">日</option>
</select>

        <button id="searchButton">
            記念日を調べる
        </button>
    </div>


    <div class="random">
        <h2>🎲 ランダムに探す</h2>

        <button id="randomButton">
            ランダムな記念日を表示
        </button>
    </div>


    <div class="result">
        <h2>🎉 今日の記念日</h2>

        <div id="result">
            ここに記念日が表示されます
        </div>
    </div>


    <script src="script.js"></script>

</body>

</html>
