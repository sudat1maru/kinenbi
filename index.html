<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日は何の日？</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🎉 今日は何の日？</h1>
    <p class="description">
    指定の日付が、何の記念日かを一つだけ表示するサイトです。<br>
    記念日の情報は
    <a href="https://ja.wikipedia.org/wiki/%E6%97%A5%E6%9C%AC%E3%81%AE%E8%A8%98%E5%BF%B5%E6%97%A5%E4%B8%80%E8%A6%A7" target="_blank">
        ウィキペディア
    </a>
    の情報を参照しています。
    また、9月の第三土曜日のレッサーパンダの日など、日付が固定でないものは省略しています。
</p>

    <div class="search">
        <h2>📅 日付から探す</h2>

        <select id="month">
    <option value="">月</option>
</select>

<select id="day">
    <option value="">日</option>
</select>

        <button id="searchButton">
            記念日を調べる
        </button>
    </div>


    <div class="random">
        <h2>🎲 ランダムに探す</h2>

        <button id="randomButton">
            ランダムな記念日を表示
        </button>
    </div>


    <div class="result">
        <h2>🎉 今日の記念日</h2>

        <div id="result">
            ここに記念日が表示されます
        </div>
    </div>


    <script src="script.js"></script>

</body>

</html>
